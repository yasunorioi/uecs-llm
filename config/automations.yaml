# automations.yaml — P1〜P7 の DSL 化スキーマ (feature/dsl-interpreter)
#
# `rule_engine.py` から shadow-run (env AGRIHA_SHADOW_RUN=1) で読まれ、
# ogms-dsl の `Interpreter` により並行評価される。実 relay 制御は
# `evaluate_rules()` が担当し、interpreter は read-only + log-only。
#
# デプロイ先: /etc/agriha/automations.yaml (rule_engine.py の run_shadow 呼び出しで明示指定)
# 設計書: ogms-DSL/docs/spec.md (private repo)

# ═══════════════════════════════════════════
# fault tier: health rule 宣言 (ogms-DSL v0.3.0+)
# ═══════════════════════════════════════════
# per-source 健全性を判定、requires_healthy で normal tier を gate。
# stuck_over は内部 accumulator (v0.6.0+)、gates.json 永続化 (v0.5.0+)。
# recovery_after=5m で chatter 防止。
health:
  indoor_humidity:
    healthy: indoor_humidity is not None and 0 < indoor_humidity < 100
    stuck_over: "30m"
    recovery_after: "5m"

  indoor_temp:
    healthy: indoor_temp is not None and -20 < indoor_temp < 60
    stuck_over: "30m"
    recovery_after: "5m"

  indoor_co2:
    healthy: indoor_co2 is not None and 200 < indoor_co2 < 5000
    stuck_over: "30m"
    recovery_after: "5m"

  outdoor_temp:
    healthy: outdoor_temp is not None and -30 < outdoor_temp < 60
    stuck_over: "1h"
    recovery_after: "5m"


automations:
  # ═══════════════════════════════════════════
  # Priority 1: 降雨 → 全窓閉 (hard_stop windows)
  # 意図的に requires_healthy 省略: rain sensor 死んでも fail-safe せず fire したいが、
  # rainfall センサは MQTT 起点で欠損時 None なので trigger 評価は None > threshold で False、
  # 発火しない。将来 tier=safety に格上げすれば fail-safe fire される
  # ═══════════════════════════════════════════
  - id: rain_close_all
    priority: 100
    trigger: rainfall > config.rain.threshold_mm_h
    action: {kind: close_all_windows}
    hard_stop: true

  # ═══════════════════════════════════════════
  # Priority 2: 強風 → 風向別閉 or 全閉 (hard_stop windows)
  # ═══════════════════════════════════════════
  - id: strong_wind
    priority: 95
    trigger: wind_speed > config.wind.strong_wind_threshold_ms
    action: {kind: close_windows_by_wind_direction}
    hard_stop: true

  # ═══════════════════════════════════════════
  # Priority 3: 急昇温 → 60% 強制換気
  # rise_rate() は temp_history 不足時に None を返すので明示 gate
  # ═══════════════════════════════════════════
  - id: rapid_rise_vent
    priority: 80
    trigger: rise_rate() is not None and rise_rate() > config.morning_ventilation.max_rise_rate_per_hour
    action: {kind: set_min_opening, value: 60}

  # ═══════════════════════════════════════════
  # Priority 3.5: TiDE 1h 湿度予測 → 先行換気 30%
  # tide_forecast_humidity_1h() は TiDE モデル未 load 時に None、閾値は rules.yaml
  # ═══════════════════════════════════════════
  - id: tide_preemptive_vent
    priority: 75
    trigger: tide_forecast_humidity_1h() is not None and tide_forecast_humidity_1h() > config.tide.humidity_prevent_threshold
    action: {kind: set_min_opening, value: 30}

  # ═══════════════════════════════════════════
  # Priority 4: 湿度換気 (release で真ヒステリシス、
  # evaluate_rules に未実装だった gap を interpreter で補完)
  # requires_healthy: RH センサ張り付き/欠損時は skip (現地 RH=100 誤発火対応)
  # ═══════════════════════════════════════════
  - id: humidity_vent
    priority: 60
    requires_healthy: [indoor_humidity]
    trigger: indoor_humidity >= config.humidity.ventilation_start   # 85
    release: indoor_humidity <= config.humidity.ventilation_stop    # 75
    action: {kind: set_min_opening, value: 30}

  # ═══════════════════════════════════════════
  # Priority 5a: CO2 critical (300ppm 以下) → 60%
  # ═══════════════════════════════════════════
  - id: co2_critical_vent
    priority: 55
    requires_healthy: [indoor_co2]
    trigger: indoor_co2 <= config.co2.critical_low   # 300
    action: {kind: set_min_opening, value: 60}

  # ═══════════════════════════════════════════
  # Priority 5b: CO2 補充 (350ppm 以下) → 30%
  # ═══════════════════════════════════════════
  - id: co2_vent
    priority: 50
    requires_healthy: [indoor_co2]
    trigger: indoor_co2 <= config.co2.ventilation_trigger   # 350
    action: {kind: set_min_opening, value: 30}

  # ═══════════════════════════════════════════
  # Priority 6: 日中温度制御
  # 夜間ブランチと寒冷ブランチは default opening=0 と max compose で自然消滅、
  # 日中過温だけを active automation として書く
  # requires_healthy: indoor_temp + outdoor_temp (window_step_lookup で使う)
  # ═══════════════════════════════════════════
  - id: daytime_temp_too_warm_vent
    priority: 40
    requires_healthy: [indoor_temp, outdoor_temp]
    trigger: not is_night() and indoor_temp > schedule_target_temp()
    action:
      kind: set_min_opening
      value_expr: window_step_lookup(outdoor_temp)

  # ═══════════════════════════════════════════
  # Priority 7: 日射比例灌水 (pulse group、windows と独立に発火)
  # ═══════════════════════════════════════════
  - id: solar_irrigation
    priority: 30
    trigger: solar_accumulated_mj() >= solar_threshold()
    action:
      kind: pulse_relay
      ch_expr: config.irrigation.channel
      duration_expr: irrigation_duration()
    on_fire:
      reset: [solar_acc.accumulated_mj]
      increment: [solar_acc.irrigations_today]
      set_timestamp: [solar_acc.last_irrigation_at]

# ═══════════════════════════════════════════
# 補足: config.tide.humidity_prevent_threshold は rules.yaml で tide: セクションに追加済。
# 未 load 時の tide_forecast_humidity_1h() None 返却は上記 trigger で明示 gate。
# ═══════════════════════════════════════════
